- resource_template: "https://intervals.icu/api/v1/athlete/0/wellness/{{ now().strftime('%Y-%m-%d') }}"
  authentication: basic
  username: API_KEY
  password: !secret intervals_icu_api_key
  scan_interval: 3600
  sensor:
    - name: Intervals Resting HR
      unique_id: intervals_icu_resting_hr
      value_template: "{{ value_json.restingHR }}"
      availability: "{{ value_json.restingHR is not none }}"
      unit_of_measurement: bpm
      state_class: measurement
    - name: Intervals HRV
      unique_id: intervals_icu_hrv
      value_template: "{{ value_json.hrv }}"
      availability: "{{ value_json.hrv is not none }}"
      unit_of_measurement: ms
      state_class: measurement
    - name: Intervals Sleep
      unique_id: intervals_icu_sleep
      value_template: "{{ (value_json.sleepSecs / 3600) | round(2) }}"
      availability: "{{ value_json.sleepSecs is not none }}"
      unit_of_measurement: h
      device_class: duration
      state_class: measurement
    - name: Intervals Avg Sleeping HR
      unique_id: intervals_icu_avg_sleeping_hr
      value_template: "{{ value_json.avgSleepingHR }}"
      availability: "{{ value_json.avgSleepingHR is not none }}"
      unit_of_measurement: bpm
      state_class: measurement
- resource_template: "https://intervals.icu/api/v1/athlete/0/wellness/{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}"
  authentication: basic
  username: API_KEY
  password: !secret intervals_icu_api_key
  scan_interval: 3600
  sensor:
    - name: Intervals Steps Yesterday
      unique_id: intervals_icu_steps_yesterday
      value_template: "{{ value_json.steps }}"
      availability: "{{ value_json.steps is not none }}"
      unit_of_measurement: steps
      state_class: measurement
    - name: Intervals Drinks Yesterday
      unique_id: intervals_icu_drinks_yesterday
      value_template: "{{ value_json.get('Drinks') | default(0, true) }}"
      unit_of_measurement: drinks
      state_class: measurement
